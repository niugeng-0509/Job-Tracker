services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobcopilot
      POSTGRES_USER: jobcopilot
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jobcopilot:change-me@db:5432/jobcopilot
      JWT_SECRET: local-compose-secret-change-me
      UPLOAD_DIR: /app/data/uploads
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data/uploads
volumes:
  postgres_data:
  uploads:
