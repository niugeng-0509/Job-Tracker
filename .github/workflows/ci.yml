name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.10 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Type-check with mypy
        run: python -m mypy app

      - name: Test with coverage
        run: >-
          python -m pytest
          --cov=app.api
          --cov=app.models
          --cov=app.schemas
          --cov=app.services
          --cov=app.repositories
          --cov-report=term-missing
          --cov-fail-under=80
